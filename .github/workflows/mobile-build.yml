name: Mobile builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install pinned Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Configure Godot Android paths
        shell: bash
        run: |
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" || -z "${JAVA_HOME:-}" ]]; then
            echo "Android SDK or JAVA_HOME is missing" >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/godot"
          {
            printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]'
            printf 'export/android/android_sdk_path = "%s"\n' "$android_sdk"
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
          } > "$HOME/.config/godot/editor_settings-4.tres"
      - name: Import and export Android pre-release APK
        run: |
          godot --headless --path . --import
          mkdir -p exports/android
          godot --headless --path . --export-debug "Android PreRelease" exports/android/ShadowRift-prerelease.apk
      - name: Verify Android package metadata
        run: |
          metadata="$("$ANDROID_SDK_ROOT/build-tools/35.0.1/aapt" dump badging exports/android/ShadowRift-prerelease.apk | head -1)"
          expected_package="$(python3 -c 'import pathlib,re; text=pathlib.Path("export_presets.cfg").read_text(); match=re.search(r"^package/unique_name=\"([^\"]+)\"$", text, re.M); assert match; print(match.group(1))')"
          expected_version="$(python3 -c 'import pathlib,re; text=pathlib.Path("export_presets.cfg").read_text(); match=re.search(r"^version/name=\"([^\"]+)\"$", text, re.M); assert match; print(match.group(1))')"
          echo "$metadata"
          grep -F "name='$expected_package'" <<<"$metadata"
          grep -F "versionName='$expected_version'" <<<"$metadata"
      - name: Report APK size and texture memory
        run: |
          apk_bytes="$(stat -c %s exports/android/ShadowRift-prerelease.apk)"
          echo "APK bytes: $apk_bytes ($(( apk_bytes / 1024 / 1024 )) MiB)"
          echo "apk_bytes=$apk_bytes" >> "$GITHUB_STEP_SUMMARY"
          pip install pillow
          python3 tools/report_mobile_memory.py
          cat build/reports/mobile-memory-report.txt | tee build/reports/mobile-build-summary.txt
          {
            echo "apk_bytes=$apk_bytes"
            echo "asset_source_bytes=$(python3 -c 'import pathlib; print(sum(p.stat().st_size for p in pathlib.Path("assets").rglob("*.png")))')"
          } >> build/reports/mobile-build-summary.txt
      - name: Check 16 KB native page-size compatibility
        continue-on-error: true
        run: |
          python3 tools/check_elf_alignment.py exports/android/ShadowRift-prerelease.apk | tee -a build/reports/mobile-build-summary.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ShadowRift-android-prerelease
          path: exports/android/ShadowRift-prerelease.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ShadowRift-android-build-report
          path: build/reports/
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          lfs: true
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Build unsigned iOS pre-release application
        run: ./tools/build_unsigned_ios.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ShadowRift-ios-prerelease-unsigned
          path: |
            exports/ios/ShadowRift-unsigned.ipa
            exports/ios/ShadowRift-xcode.zip
          if-no-files-found: error
