name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Verify source contract
        run: python tools/verify_project.py
      - name: Import and parse project
        run: godot --headless --path . --editor --quit
      - name: Run GDScript behavior tests
        run: godot --headless --path . --script res://tests/test_runner.gd
